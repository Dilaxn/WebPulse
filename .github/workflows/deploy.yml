name: Build & Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: deploy-webpulse
env:
  IMAGE: ghcr.io/dilaxn/webpulse
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    runs-on: ubuntu-24.04-arm
    needs: build
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_KEY_SECRET }}
      AWS_DEFAULT_REGION: ap-south-1
      SG_ID: sg-09c36ce8067f2b51d
    steps:
      - name: Open SSH for runner
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress \
            --group-id $SG_ID --protocol tcp --port 22 --cidr $RUNNER_IP/32 || true

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/paas
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull webpulse
            docker compose up -d webpulse
            docker image prune -f

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id $SG_ID --protocol tcp --port 22 --cidr $RUNNER_IP/32 || true
